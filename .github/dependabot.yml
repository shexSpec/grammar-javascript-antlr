version: 2
updates:
  - package-ecosystem: npm
    directory: "/semacts"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Minor+patch churn lands as one green PR a week; majors stay one-per-PR
    # so a breaking bump fails CI on its own without blocking the rest.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # semacts/lib/ is checked-in code generated by the ANTLR 4.8 tool; it
      # requires 'antlr4/index', which newer runtimes (e.g. 4.13) don't export. Bump the runtime
      # only together with regenerating lib/ (make -C semacts) on the same version.
      - dependency-name: antlr4

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ["*"]
